<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>财记真实浏览器门禁</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    iframe { width: 390px; height: 844px; border: 0; }
    #result { position: fixed; inset: auto 8px 8px; z-index: 9; padding: 6px; background: white; font: 12px monospace; }
  </style>
</head>
<body data-browser-gate="pending">
  <iframe id="app" title="财记测试实例"></iframe>
  <img src="/__gate_delay__" alt="" hidden>
  <pre id="result">RUNNING</pre>
  <script>
    (function () {
      "use strict";
      var result = document.getElementById("result");
      function wait(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }
      function check(condition, message) { if (!condition) throw new Error(message); }
      function setValues(d, values) {
        Object.keys(values).forEach(function (id) {
          var field = d.getElementById(id);
          check(field, "missing form field #" + id);
          field.value = values[id];
          field.dispatchEvent(new frame.contentWindow.Event("change", { bubbles: true }));
        });
      }
      function submit(d, id) {
        var form = d.getElementById(id);
        check(form, "missing form #" + id);
        form.dispatchEvent(new frame.contentWindow.Event("submit", { bubbles: true, cancelable: true }));
      }
      function visible(w, element) {
        if (!element || element.hidden || element.getAttribute("aria-hidden") === "true") return false;
        var style = w.getComputedStyle(element);
        return style.display !== "none" && style.visibility !== "hidden" && element.getClientRects().length > 0;
      }
      function accessibleName(d, element) {
        var labelled = element.getAttribute("aria-labelledby");
        if (labelled) return labelled.split(/\s+/).map(function (id) { var node = d.getElementById(id); return node ? node.textContent : ""; }).join(" ").trim();
        var direct = element.getAttribute("aria-label") || element.getAttribute("title") || "";
        if (direct.trim()) return direct.trim();
        if (element.id) {
          var label = d.querySelector('label[for="' + element.id + '"]');
          if (label && label.textContent.trim()) return label.textContent.trim();
        }
        return String(element.textContent || element.value || element.placeholder || "").trim();
      }
      function finish(ok, message) {
        document.body.setAttribute("data-browser-gate", ok ? "pass" : "fail");
        result.textContent = (ok ? "PASS " : "FAIL ") + message;
      }
      try { localStorage.clear(); } catch (err) {}
      var frame = document.getElementById("app");
      var phase = "initial";
      frame.addEventListener("load", function () {
        (async function () {
          var w = frame.contentWindow, d = frame.contentDocument;
          await wait(600);
          if (phase === "reload") {
            check(w.state.moneyAccounts.length === 2, "reload lost real accounts");
            check(w.state.incomes.length === 1 && w.state.expenses.length === 1, "reload lost income or expense");
            check(w.state.transfers.length === 1 && w.state.reconciliations.length === 1, "reload lost transfer or reconciliation");
            var reloadedBank = w.state.moneyAccounts.find(function (item) { return item.name === "工资卡（已编辑）"; });
            var reloadedWallet = w.state.moneyAccounts.find(function (item) { return item.name === "测试钱包"; });
            check(reloadedBank && reloadedBank.note === "编辑流程已验证", "edited account did not persist across reload");
            check(reloadedWallet && reloadedWallet.archived, "archived account did not persist across reload");
            check(w.moneyAccountBalance(reloadedBank, "2026-08") === 1445, "reconciled bank balance changed after reload");
            finish(true, "empty state, CSV preview, sample save, full CRUD/reload, IDB round-trip, mobile layout, runtime a11y, semantics and data hierarchy");
            return;
          }
          if (typeof w.refreshStorageHealth === "function") await w.refreshStorageHealth();

          check(/待评估/.test(d.getElementById("dashboardAssetHealth").textContent), "empty health must be unknown");
          check(d.getElementById("dashboardTotalAsset").textContent === "待建账", "empty wealth must be unknown");
          check(/先建立三条真实基线/.test(d.getElementById("dashboardRightCards").textContent), "onboarding guide missing");
          check(!/本月平稳|账目结构正常|自动保存正常/.test(d.getElementById("dashboardCockpit").textContent), "fabricated healthy copy returned");

          var healthButton = d.getElementById("dashboardAssetHealth");
          check(healthButton.tagName === "BUTTON", "health explanation is not actionable");
          healthButton.click();
          await wait(30);
          check(d.getElementById("healthModal").classList.contains("open"), "health explanation did not open");
          w.closeHealthModal("dismiss");

          var nodes = d.querySelectorAll("#wealthCompassNodes .compass-node");
          check(nodes.length === 6, "compass node count changed");
          check(d.querySelectorAll("#wealthCompassNodes button").length === 3, "no-op compass buttons returned");
          check(d.querySelectorAll('#wealthCompassNodes [role="status"]').length === 3, "read-only compass semantics missing");

          var homeButtons = d.querySelectorAll(".dashboard-home-action");
          Array.prototype.forEach.call(homeButtons, function (button) {
            var rect = button.getBoundingClientRect();
            check(rect.width >= 44 && rect.height >= 44, "mobile home target below 44px");
            check(!!button.getAttribute("aria-label"), "mobile home target has no accessible name");
          });
          var nodeDesc = d.querySelector(".compass-node .node-desc");
          check(parseFloat(w.getComputedStyle(nodeDesc).fontSize) >= 12, "mobile node context below 12px");
          var strip = d.getElementById("dashboardBottomStrip");
          check(strip.scrollWidth > strip.clientWidth, "mobile data strip is not horizontally scrollable");
          check(w.getComputedStyle(d.getElementById("dashboardStripHint")).display !== "none", "horizontal scroll hint is hidden");
          check(d.documentElement.scrollWidth <= d.documentElement.clientWidth + 1, "mobile document has page-level horizontal overflow");
          check(d.body.scrollWidth <= d.body.clientWidth + 1, "mobile body has page-level horizontal overflow");
          Array.prototype.forEach.call(d.querySelectorAll("button, input, select, textarea"), function (control) {
            if (!visible(w, control) || control.type === "hidden") return;
            check(!!accessibleName(d, control), "visible control has no accessible name: " + (control.id || control.tagName));
          });
          Array.prototype.forEach.call(d.querySelectorAll("#dashboardCockpit button"), function (button) {
            if (!visible(w, button)) return;
            var rect = button.getBoundingClientRect();
            check(rect.width >= 44 && rect.height >= 44, "dashboard action target below 44px: " + (button.id || button.textContent.trim()));
          });

          check(typeof w.ledgerCsvReadRows === "function", "independent CSV ledger importer is missing");
          var ledgerRows = w.ledgerCsvReadRows([
            "日期,项目,分类,收入,支出,类型,备注",
            "2026-08-15,实际到账工资,工资,5430,,收入,",
            "2026-08-15,公司餐费,日常开支,,70,工资代扣,到账前结算"
          ].join("\n"));
          w.ledgerCsvSession = { rows: ledgerRows, decisions: {} };
          w.renderLedgerCsvPreview();
          check(!d.getElementById("ledgerCsvPreview").hidden, "CSV preview did not open");
          check(/新增收入1/.test(d.getElementById("ledgerCsvPreviewStats").textContent.replace(/\s/g, "")), "CSV income preview count is wrong");
          check(/新增支出1/.test(d.getElementById("ledgerCsvPreviewStats").textContent.replace(/\s/g, "")), "CSV payroll preview count is wrong");
          check(!d.getElementById("confirmLedgerCsvImport").disabled, "valid CSV preview cannot be confirmed");
          w.resetLedgerCsvImport();

          var sample = await fetch("/tests/fixtures/dashboard-sample.json").then(function (response) { return response.json(); });
          var prepared = w.prepareImportedState(sample);
          check(prepared.ok, "sample import validation failed");
          w.state = prepared.state;
          check(w.save(), "browser localStorage save failed");
          w.renderAll();
          check(!/待评估/.test(d.getElementById("dashboardAssetHealth").textContent), "rated sample stayed unknown");
          check(!/先建立三条真实基线/.test(d.getElementById("dashboardRightCards").textContent), "onboarding did not retire after real data");
          check(await w.idbCreateVerifiedBackup(w.state), "IndexedDB read-back verification failed");
          var latest = await w.idbReadLatestBackup();
          check(latest && latest.state && latest.state.expenses.length === sample.expenses.length, "IndexedDB backup round-trip mismatch");

          var exportButton = d.getElementById("exportData");
          var backupButton = d.getElementById("idbRestoreLatest");
          var importButton = d.getElementById("importData");
          var ledgerButton = d.getElementById("previewLedgerCsv");
          var cloud = d.querySelector(".experimental-sync-card");
          check(exportButton.compareDocumentPosition(backupButton) & Node.DOCUMENT_POSITION_FOLLOWING, "backup does not follow export");
          check(backupButton.compareDocumentPosition(importButton) & Node.DOCUMENT_POSITION_FOLLOWING, "import does not follow automatic backup");
          check(importButton.compareDocumentPosition(ledgerButton) & Node.DOCUMENT_POSITION_FOLLOWING, "ledger append does not follow JSON recovery");
          check(ledgerButton.compareDocumentPosition(cloud) & Node.DOCUMENT_POSITION_FOLLOWING, "experimental cloud sync precedes local safety actions");
          check(!cloud.open, "experimental cloud sync must default closed");
          var manifest = await fetch("/manifest.webmanifest").then(function (response) { return response.json(); });
          check(manifest.orientation === "any", "manifest still forces portrait");

          w.state = w.normalizeState(null);
          check(w.save(), "could not reset state before CRUD flow");
          w.renderAll();
          setValues(d, {
            moneyAccountName: "测试工资卡",
            moneyAccountType: "银行卡",
            moneyAccountOpeningBalance: "1000",
            moneyAccountOpeningBalanceDate: "2026-08-01",
            moneyAccountNote: "新增流程"
          });
          submit(d, "moneyAccountForm");
          check(w.state.moneyAccounts.length === 1, "first real account was not created through the form");
          var bankId = w.state.moneyAccounts[0].id;
          setValues(d, {
            moneyAccountName: "测试钱包",
            moneyAccountType: "现金",
            moneyAccountOpeningBalance: "100",
            moneyAccountOpeningBalanceDate: "2026-08-01",
            moneyAccountNote: "归档流程"
          });
          submit(d, "moneyAccountForm");
          check(w.state.moneyAccounts.length === 2, "second real account was not created through the form");
          var walletId = w.state.moneyAccounts.find(function (item) { return item.name === "测试钱包"; }).id;
          var dailyPool = w.state.accounts.find(function (item) { return item.name === "日常开支"; });
          check(!!dailyPool, "default daily-use pool is missing");
          setValues(d, {
            incomeDate: "2026-08-15",
            incomeSource: "工资",
            incomeMoneyAccount: bankId,
            incomeAccount: dailyPool.id,
            incomeAmount: "500",
            incomeNote: "真实表单新增收入"
          });
          submit(d, "incomeForm");
          setValues(d, {
            expenseDate: "2026-08-16",
            expenseAccount: dailyPool.id,
            expenseMoneyAccount: walletId,
            expenseCategory: "餐饮",
            expenseAmount: "20",
            expenseNote: "真实表单新增支出"
          });
          submit(d, "expenseForm");
          setValues(d, {
            transferDate: "2026-08-17",
            transferFromAccount: bankId,
            transferToAccount: walletId,
            transferAmount: "50",
            transferNote: "真实双边转账"
          });
          submit(d, "transferForm");
          check(w.state.incomes.length === 1 && w.state.expenses.length === 1 && w.state.transfers.length === 1, "cash-flow CRUD creation failed");
          setValues(d, {
            reconciliationDate: "2026-08-18",
            reconciliationMoneyAccount: bankId,
            reconciliationActualBalance: "1445",
            reconciliationNote: "真实余额核对"
          });
          submit(d, "reconciliationForm");
          check(w.state.reconciliations.length === 1 && w.state.reconciliations[0].adjustment === -5, "reconciliation did not record the expected -5 adjustment");
          w.editRecord("moneyAccount", bankId);
          setValues(d, { moneyAccountName: "工资卡（已编辑）", moneyAccountNote: "编辑流程已验证" });
          submit(d, "moneyAccountForm");
          check(w.state.moneyAccounts.find(function (item) { return item.id === bankId; }).name === "工资卡（已编辑）", "account edit did not preserve the entity id");
          w.removeRecord("moneyAccount", walletId);
          await wait(30);
          var firstConfirm = d.querySelector('[data-dialog-action="ok"]');
          check(!!firstConfirm, "delete confirmation did not open");
          firstConfirm.click();
          await wait(30);
          var archiveConfirm = d.querySelector('[data-dialog-action="ok"]');
          check(!!archiveConfirm, "referenced-account archive confirmation did not open");
          archiveConfirm.click();
          await wait(80);
          check(w.state.moneyAccounts.find(function (item) { return item.id === walletId; }).archived, "referenced real account was not archived");
          check(w.moneyAccountBalance(w.state.moneyAccounts.find(function (item) { return item.id === bankId; }), "2026-08") === 1445, "bank balance is wrong after transfer and reconciliation");
          phase = "reload";
          frame.src = "/index.html?quality-gate-reload=1";
        })().catch(function (error) { finish(false, error && error.message ? error.message : String(error)); });
      });
      frame.src = "/index.html";
    })();
  </script>
</body>
</html>
